trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: deployFrontend
    displayName: Deploy frontend to chelseaxp-web
    type: boolean
    default: false

stages:
  - stage: Build
    displayName: Build and verify
    jobs:
      - job: BuildApps
        displayName: Build ChelseaXP
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
            displayName: Use Node.js 24
          - script: |
              set -e
              npm ci
              npm run lint
              npm run build
            workingDirectory: frontend
            displayName: Check and build the React app
            env:
              VITE_API_ORIGIN: https://chelseaxp-api.victoriouscoast-91561d2b.westus2.azurecontainerapps.io
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: '11.0.x'
            displayName: Use .NET 11 SDK
          - script: dotnet publish backend/ChelseaXP.Api/ChelseaXP.Api.csproj --configuration Release --output "$(Build.ArtifactStagingDirectory)/api"
            displayName: Build and publish the ASP.NET Core API
          - bash: |
              set -euo pipefail
              dotnet "$(Build.ArtifactStagingDirectory)/api/ChelseaXP.Api.dll" --urls http://127.0.0.1:5080 &
              api_pid=$!
              trap 'kill "$api_pid" 2>/dev/null || true' EXIT
              response=$(curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5080/api/health)
              node -e 'if (JSON.parse(process.argv[1]).status !== "ok") process.exit(1)' "$response"
            displayName: Smoke test the published API
          - publish: frontend/dist
            artifact: frontend
            displayName: Publish frontend build artifact
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api
            displayName: Publish API build artifact

  - stage: DeployFrontend
    displayName: Deploy frontend
    dependsOn: Build
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        or(
          in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'),
          and(eq(variables['Build.Reason'], 'Manual'), ${{ eq(parameters.deployFrontend, true) }})
        )
      )
    jobs:
      - job: DeployStaticSite
        displayName: Publish to Azure Static Web Apps
        steps:
          - checkout: none

          - download: current
            artifact: frontend
            displayName: Download frontend build artifact

          - task: AzureStaticWebApp@0
            displayName: Deploy the prebuilt frontend
            inputs:
              workingDirectory: $(Pipeline.Workspace)
              app_location: 'frontend'
              output_location: ''
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
