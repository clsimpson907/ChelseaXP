name: Publish API image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/clsimpson907/chelseaxp-api
    steps:
      - name: Check out the API source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the API image
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" backend/ChelseaXP.Api

      - name: Smoke-test the API image
        run: |
          container=$(docker run --detach --publish 127.0.0.1::8080 "$IMAGE:$GITHUB_SHA")
          trap 'docker inspect --format "{{json .State}}" "$container"; docker logs "$container"; docker rm --force "$container"' EXIT
          address=$(docker port "$container" 8080/tcp)
          response=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 3 --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 20 "http://$address/api/health")
          node -e 'if (JSON.parse(process.argv[1]).status !== "ok") process.exit(1)' "$response"

      - name: Push the tested image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --platform linux/amd64 "$IMAGE:$GITHUB_SHA"
          printf 'Published image: `%s:%s`\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
